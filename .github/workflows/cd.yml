name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: SSH and redeploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull eijkeyal/team-task-management:latest
            docker stop team-task-api || true
            docker rm team-task-api || true
            docker run -d \
              --name team-task-api \
              -p 3000:3000 \
              --env-file /home/ubuntu/team-task-app/.env \
              --restart unless-stopped \
              eijkeyal/team-task-management:latest
            docker image prune -f
            echo "Deploy complete"
